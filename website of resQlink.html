<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResQLink AI | Admin Portal</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#162b43;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}.layout{display:flex;min-height:100vh}.sidebar{width:252px;background:linear-gradient(180deg,#102c49,#0c2036);color:#d9e5f5;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;padding:24px 14px}.brand{display:flex;gap:11px;align-items:center;margin:0 10px 34px;font-size:14px;line-height:1.15}.brand-logo{background:linear-gradient(135deg,#ff3c42 45%,#188bda 45%);color:white;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:23px;flex-shrink:0}.brand small,.user small{display:block;font-size:10px;letter-spacing:1px;margin-top:6px;opacity:.8}.sidebar nav{display:grid;gap:4px}.nav-item{width:100%;text-align:left;border:0;background:none;color:#dce8f7;padding:13px 15px;border-radius:7px;font-size:13px}.nav-item.active,.nav-item:hover{background:#22549a;color:#fff}.nav-item span{display:inline-block;width:27px}.side-bottom{margin-top:auto;padding:18px 12px;font-size:12px;color:#a6b9cf;line-height:1.8}main{flex:1;min-width:0}.topbar{height:76px;background:white;border-bottom:1px solid #e6edf4;display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:20px}.search{border:1px solid #e0e8f2;border-radius:7px;padding:9px 14px;color:#8b9bad;min-width:260px}.search input{border:0;outline:0;width:85%;font-size:13px}.user{display:flex;gap:12px;align-items:center;font-size:12px}.user small{letter-spacing:0}.avatar{font-size:22px}.notification{color:#f43c48}.content{max-width:1550px;margin:auto;padding:28px 30px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.heading h1{font-size:27px;letter-spacing:-.6px;margin:0 0 5px}.heading p{color:#7b8ba0;font-size:13px;margin:0}.primary,.login-card button{border:0;background:#1265eb;color:white;border-radius:7px;padding:11px 17px;font-size:13px;font-weight:600}.outline{border:1px solid #d7e2f0;background:white;border-radius:6px;padding:9px 13px;color:#315070;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;margin-bottom:22px}.card,.panel{background:white;border:1px solid #e6edf6;border-radius:11px;box-shadow:0 3px 15px #233d5c08}.card{padding:22px;min-height:125px}.card .metric{font-size:30px;font-weight:800;margin:13px 0 4px}.card .label{font-size:12px;color:#5c7087}.card .hint{font-size:11px;color:#8da0b6}.card .symbol{font-size:22px}.card.red{border-color:#ffd7d7}.card.orange{border-color:#ffebd4}.card.green{border-color:#d7f1e4}.card.blue{border-color:#dbe7ff}.panels{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}.panel{padding:19px;min-width:0;margin-bottom:18px}.panel h3{font-size:15px;margin:0 0 18px}.map{min-height:335px;background:linear-gradient(40deg,#d4ebd9 10%,#e7f3e7 10% 20%,#e1ebf1 20% 32%,#d7e6e9 32% 45%,#e9f0e3 45%);position:relative;overflow:hidden;border-radius:8px;border:1px solid #dce8e5}.map:before,.map:after{content:'';position:absolute;width:150%;height:16px;background:#fff;transform:rotate(-32deg);left:-20%;top:40%;box-shadow:0 75px 0 #fff,0 -110px 0 #fff}.map:after{transform:rotate(35deg);top:60%;height:10px}.map-label{position:absolute;top:48%;left:43%;font-size:22px;font-weight:700;color:#4c7582;z-index:2}.pin{position:absolute;z-index:3;font-size:27px;filter:drop-shadow(0 2px 3px #0003)}.map-note{position:absolute;bottom:12px;left:12px;background:white;padding:9px 12px;border-radius:7px;z-index:3;font-size:11px}.table-wrap{overflow-x:auto}.data-table{width:100%;border-collapse:collapse;text-align:left;font-size:12px;white-space:nowrap}.data-table th{background:#f7f9fc;color:#60748a;font-weight:600}.data-table th,.data-table td{padding:13px 11px;border-bottom:1px solid #edf1f7}.data-table td{max-width:230px;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-block;padding:5px 9px;border-radius:5px;font-size:11px;font-weight:600;background:#edf3fc;color:#3c618b}.pill.pending,.pill.active,.pill.responding,.pill.in_progress{background:#fff0c8;color:#9c6500}.pill.verified,.pill.resolved,.pill.open,.pill.published{background:#d9f6e4;color:#147a45}.pill.rejected,.pill.critical,.pill.closed{background:#ffe0e1;color:#bd2630}.action{background:#eaf2ff;color:#0d60df;border:0;border-radius:5px;padding:6px 9px;margin:2px;font-size:11px}.action.danger{background:#ffebeb;color:#c52d36}.action.good{background:#e0f8e9;color:#0e8549}.muted{color:#8293a8;font-size:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.pagination{display:flex;justify-content:flex-end;gap:10px;margin-top:17px}.empty{padding:50px;text-align:center;color:#7a8da2}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102a47,#175da4)}.login-card{width:min(430px,92vw);background:white;border-radius:17px;padding:38px;box-shadow:0 20px 60px #0003}.login-card .brand-logo{margin:auto}.login-card h1{text-align:center;margin:16px 0 4px}.login-card p{text-align:center;color:#7d8da2;font-size:13px;margin-bottom:27px}.login-card label{display:block;margin:15px 0;font-size:13px;font-weight:600}.login-card input{width:100%;margin-top:8px;padding:13px;border:1px solid #d7e2ef;border-radius:7px}.login-card button{width:100%;margin:12px 0}.login-card small{display:block;text-align:center;color:#9aabba}.error{color:#c52537;font-size:12px}dialog{border:0;border-radius:13px;box-shadow:0 20px 80px #0003;width:min(530px,95vw);max-height:85vh;overflow:auto;padding:24px}dialog::backdrop{background:#0b223a88}.dialog-head,.dialog-actions{display:flex;justify-content:space-between;align-items:center;gap:12px}.dialog-head h2{margin:0 0 12px}.dialog-actions{justify-content:flex-end;margin-top:20px}#editorFields label{display:block;font-size:12px;font-weight:600;margin:12px 0}#editorFields input,#editorFields textarea,#editorFields select{display:block;width:100%;padding:10px;margin-top:6px;border:1px solid #d6e1ec;border-radius:6px}#toast{position:fixed;bottom:24px;right:24px;background:#122f4f;color:white;padding:12px 20px;border-radius:7px;display:none;z-index:10}.mobile-menu{display:none}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}}@media(max-width:720px){.sidebar{position:fixed;z-index:5;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.mobile-menu{display:block;border:0;background:none;font-size:20px}.topbar{padding:0 14px}.search{min-width:0;width:42%}.user .notification,.user .avatar,.user small{display:none}.content{padding:18px}.cards{gap:10px}.card{padding:14px}.heading h1{font-size:22px}}
</style>
</head>
<body>
<div id="login" class="login">
  <form id="loginForm" class="login-card">
    <div class="brand-logo">✚</div>
    <h1>ResQLink AI</h1>
    <p>CDRRMO / LGU Administration Portal</p>
    <label>Admin token<input id="token" type="password" autocomplete="off" placeholder="Paste your admin token" required></label>
    <button type="submit">Sign in</button>
    <div id="loginError" class="error"></div>
    <small>Use the token from server/.env or one issued by the super admin</small>
  </form>
</div>
<div id="app" class="layout hidden">
  <aside class="sidebar">
    <div class="brand"><div class="brand-logo">✚</div><div><b>CommunityLink<br>ResQLink AI</b><small>ADMIN PANEL</small></div></div>
    <nav id="nav"></nav>
    <div class="side-bottom">Cavite Emergency Operations</div>
  </aside>
  <main>
    <header class="topbar">
      <button id="menuBtn" class="mobile-menu">☰</button>
      <div class="search">⌕ <input id="search" placeholder="Search current module..."></div>
      <div class="user"><span class="avatar">👤</span><span><b id="adminName">Admin</b><small id="adminRole"></small></span><button id="logout" class="outline">Logout</button></div>
    </header>
    <div class="content">
      <div class="heading"><div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle"></p></div><button id="addBtn" class="primary hidden">+ Add New</button></div>
      <div id="mainContent"></div>
    </div>
  </main>
</div>
<dialog id="editor"><form id="editorForm"><div class="dialog-head"><h2 id="editorTitle">Add</h2><button type="button" id="closeEditor" class="outline">✕</button></div><div id="editorFields"></div><div class="dialog-actions"><button type="button" id="cancelEditor" class="outline">Cancel</button><button type="submit" class="primary">Save</button></div></form></dialog>
<div id="toast" role="status"></div>
<script>
// Opened as a file? talk to the local server. Served by FastAPI? use same origin.
const API_BASE = location.protocol === 'file:' ? 'http://localhost:8001' : '';
let TOKEN = '', ME = null;
try { TOKEN = sessionStorage.getItem('resqlink_token') || ''; } catch (e) {}

async function api(path, opt = {}) {
  const res = await fetch(API_BASE + path, {
    method: opt.method || 'GET',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
    body: opt.body || null
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : (res.status === 401 ? 'Invalid token.' : 'Server error ' + res.status));
  return data;
}

const $ = s => document.querySelector(s);
const esc = x => String(x ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty = s => String(s).replaceAll('_', ' ').replace(/\b\w/g, c => c.toUpperCase());
function toast(s) { $('#toast').textContent = s; $('#toast').style.display = 'block'; setTimeout(() => $('#toast').style.display = 'none', 3500); }

const modules = [
  ['dashboard','⌂','Dashboard','Overview of reports and SOS status'],
  ['reports','▤','Disaster Reports','Verify or delete community-submitted reports'],
  ['centers','⌂','Evacuation Centers','Manage evacuation center availability'],
  ['sos','⚠','SOS Alerts','Monitor and clear active SOS alerts'],
  ['announcements','◀','Announcements','Publish public announcements'],
  ['accounts','👤','Admin Accounts','Super admin only: manage admin tokens']
];
const fields = {
  centers: ['name','address','latitude','longitude','capacity','occupancy','status'],
  announcements: ['title','message','level','audience'],
  accounts: ['name','organization','organization_name']
};
let current = 'dashboard', page = 1, editing = null, rows = [], overview = null;

function showLogin() { $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); }
function showApp() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#adminName').textContent = ME.name; $('#adminRole').textContent = ME.organization_label || pretty(ME.role);
  const list = modules.filter(m => m[0] !== 'accounts' || ME.role === 'super_admin');
  $('#nav').innerHTML = list.map(([id, ico, name]) => `<button class="nav-item" data-page="${id}"><span>${ico}</span>${name}</button>`).join('');
  $('#nav').onclick = e => { const b = e.target.closest('[data-page]'); if (b) navigate(b.dataset.page); };
  navigate('dashboard');
}
function navigate(id) {
  current = id; page = 1; $('#search').value = '';
  const m = modules.find(x => x[0] === id);
  $('#pageTitle').textContent = m[2]; $('#pageSubtitle').textContent = m[3];
  document.querySelectorAll('.nav-item').forEach(x => x.classList.toggle('active', x.dataset.page === id));
  $('#addBtn').classList.toggle('hidden', !fields[id]);
  $('#addBtn').textContent = '+ Add ' + ({centers:'Center', announcements:'Announcement', accounts:'Admin'}[id] || '');
  $('.sidebar').classList.remove('open');
  load();
}
const pill = v => `<span class="pill ${esc(String(v).toLowerCase().split(' ')[0])}">${esc(pretty(String(v ?? '')))}</span>`;
function table(items, keys, actionsFn) {
  if (!items || !items.length) return '<div class="empty">No records found.</div>';
  return `<div class="table-wrap"><table class="data-table"><thead><tr>${keys.map(k => `<th>${pretty(k)}</th>`).join('')}${actionsFn ? '<th>Actions</th>' : ''}</tr></thead><tbody>${items.map(r => `<tr>${keys.map(k => {
    const v = r[k];
    if (k === 'status' || k === 'level') return `<td>${pill(v)}</td>`;
    if (k === 'photo_url') return `<td>${v ? `<a href="${esc(v)}" target="_blank" rel="noopener">View photo</a>` : '—'}</td>`;
    return `<td title="${esc(v)}">${esc(v)}</td>`;
  }).join('')}${actionsFn ? `<td>${actionsFn(r)}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;
}
const reportActions = r => `<button class="action good" data-action="verify" data-id="${r.id}">Verify</button><button class="action danger" data-action="delete" data-id="${r.id}">Delete</button>`;
const editActions = r => `<button class="action" data-action="edit" data-id="${r.id}">Edit</button><button class="action danger" data-action="delete" data-id="${r.id}">Delete</button>`;

async function load() {
  const main = $('#mainContent');
  try {
    if (['dashboard','reports','sos'].includes(current)) overview = await api('/api/admin/overview');
    const q = $('#search').value.toLowerCase();
    if (current === 'dashboard') {
      const s = overview.stats;
      main.innerHTML = `<div class="cards">${[
        ['red','⚠',s.pendingReports,'Pending Reports','Awaiting verification'],
        ['green','✓',s.verifiedReports,'Verified Reports','Confirmed incidents'],
        ['blue','▤',s.totalReports,'Total Reports','In your area'],
        ['orange','🚨',s.activeSos ? 'Yes' : 'None','Active SOS','Emergency requests']
      ].map(x => `<div class="card ${x[0]}"><div class="symbol">${x[1]}</div><div class="metric">${x[2]}</div><div class="label">${x[3]}</div><div class="hint">${x[4]}</div></div>`).join('')}</div>
      <section class="panel"><h3>Recent Disaster Reports</h3>${table(overview.hazards.slice(0,10), ['id','type','description','time','status'])}</section>`;
    } else if (current === 'reports') {
      rows = overview.hazards.filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
      main.innerHTML = `<section class="panel"><div class="toolbar"><b>${rows.length} records</b></div>${table(rows, ['id','type','description','time','status','photo_url'], reportActions)}</section>`;
    } else if (current === 'sos') {
      const s = overview.activeSos;
      main.innerHTML = `<section class="panel"><h3>Active SOS</h3>${s
        ? `<p>SOS #${esc(s.id)} at ${esc(s.lat)}, ${esc(s.lng)}</p><a href="https://www.google.com/maps?q=${s.lat},${s.lng}" target="_blank" rel="noopener">Open in Maps</a><p><button class="action good" data-action="clearsos">Mark resolved</button></p>`
        : '<div class="empty">No active SOS alerts.</div>'}</section>`;
    } else if (current === 'centers') {
      const d = await api(`/api/centers?page=${page}&search=${encodeURIComponent($('#search').value)}`);
      rows = d.rows || [];
      main.innerHTML = `<section class="panel"><div class="toolbar"><b>${d.total || 0} records</b><span class="muted">Page ${d.page}</span></div>${table(rows, ['id','name','address','capacity','occupancy','status'], editActions)}<div class="pagination"><button class="outline" id="prev" ${page === 1 ? 'disabled' : ''}>← Previous</button><button class="outline" id="next" ${page * 20 >= d.total ? 'disabled' : ''}>Next →</button></div></section>`;
      $('#prev').onclick = () => { page--; load(); }; $('#next').onclick = () => { page++; load(); };
    } else if (current === 'announcements') {
      const d = await api('/api/announcements');
      rows = (d.items || []).filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
      main.innerHTML = `<section class="panel">${table(rows, ['id','title','message','level','audience','created_at'])}</section>`;
    } else if (current === 'accounts') {
      const d = await api('/api/admin/accounts');
      rows = d.items || [];
      main.innerHTML = `<section class="panel">${table(rows, ['id','name','organization_label','active','created_at'], r => `<button class="action ${r.active ? 'danger' : 'good'}" data-action="toggle" data-id="${r.id}">${r.active ? 'Deactivate' : 'Activate'}</button>`)}</section>`;
    }
  } catch (e) {
    main.innerHTML = `<div class="panel error">${esc(e.message)}</div>`;
  }
}

$('#mainContent').onclick = async e => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  const act = b.dataset.action, id = b.dataset.id;
  try {
    if (act === 'edit') { openEditor(rows.find(x => String(x.id) === id)); return; }
    if (act === 'verify') await api(`/api/admin/hazards/${id}/verify`, { method: 'PUT' });
    else if (act === 'clearsos') { if (!confirm('Mark the active SOS as resolved?')) return; await api('/api/admin/sos/clear', { method: 'POST' }); }
    else if (act === 'toggle') { const r = rows.find(x => String(x.id) === id); await api(`/api/admin/accounts/${id}`, { method: 'PATCH', body: JSON.stringify({ active: !r.active }) }); }
    else if (act === 'delete') {
      if (!confirm('Permanently delete this record?')) return;
      await api(current === 'centers' ? `/api/centers/${id}` : `/api/admin/hazards/${id}`, { method: 'DELETE' });
    }
    toast('Done'); load();
  } catch (err) { toast(err.message); }
};

function openEditor(record = null) {
  editing = record;
  $('#editorTitle').textContent = (record ? 'Edit ' : 'Add ') + modules.find(m => m[0] === current)[2];
  const sel = { status: ['open','full','closed'], level: ['info','warning','critical'], organization: ['mdrrmo','cityhall_bacoor','other_lgu','other_org'] };
  $('#editorFields').innerHTML = fields[current].map(k => {
    const v = record?.[k] ?? '';
    let input = k === 'message' ? `<textarea name="${k}" rows="4">${esc(v === '' ? '' : v)}</textarea>`
      : `<input name="${k}" value="${v === '' ? '' : esc(v)}" ${['latitude','longitude','capacity','occupancy'].includes(k) ? 'type="number" step="any"' : 'type="text"'}>`;
    if (sel[k]) input = `<select name="${k}">${sel[k].map(o => `<option value="${o}" ${v === o ? 'selected' : ''}>${pretty(o)}</option>`).join('')}</select>`;
    return `<label>${pretty(k)}${input}</label>`;
  }).join('');
  $('#editor').showModal();
}
$('#editorForm').onsubmit = async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  for (const k of ['latitude','longitude','capacity','occupancy']) if (k in data) data[k] = data[k] === '' ? 0 : Number(data[k]);
  try {
    if (current === 'centers') await api('/api/centers' + (editing ? '/' + editing.id : ''), { method: editing ? 'PATCH' : 'POST', body: JSON.stringify(data) });
    else if (current === 'announcements') await api('/api/announcements', { method: 'POST', body: JSON.stringify(data) });
    else if (current === 'accounts') {
      const r = await api('/api/admin/accounts', { method: 'POST', body: JSON.stringify(data) });
      prompt('Copy this token now. It will not be shown again:', r.token);
    }
    $('#editor').close(); toast('Saved'); load();
  } catch (err) { toast(err.message); }
};
$('#closeEditor').onclick = $('#cancelEditor').onclick = () => $('#editor').close();
$('#addBtn').onclick = () => openEditor();
$('#menuBtn').onclick = () => $('.sidebar').classList.toggle('open');
let timer; $('#search').oninput = () => { clearTimeout(timer); timer = setTimeout(() => { page = 1; load(); }, 350); };

async function signIn(token) {
  TOKEN = token.trim();
  const d = await api('/api/admin/overview');
  ME = d.principal;
  try { sessionStorage.setItem('resqlink_token', TOKEN); } catch (e) {}
  showApp();
}
$('#loginForm').onsubmit = async e => {
  e.preventDefault(); $('#loginError').textContent = '';
  try { await signIn($('#token').value); }
  catch (err) { TOKEN = ''; $('#loginError').textContent = err.message === 'Failed to fetch' ? 'Cannot reach the server at ' + (API_BASE || location.origin) + '. Is app.py running?' : err.message; }
};
$('#logout').onclick = () => { TOKEN = ''; ME = null; try { sessionStorage.removeItem('resqlink_token'); } catch (e) {} showLogin(); };
if (TOKEN) signIn(TOKEN).catch(() => showLogin());
</script>
</body>
</html>

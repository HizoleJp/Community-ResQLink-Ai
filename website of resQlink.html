<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResQLink AI | Admin Portal</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#162b43;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}.layout{display:flex;min-height:100vh}.sidebar{width:252px;background:linear-gradient(180deg,#102c49,#0c2036);color:#d9e5f5;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;padding:24px 14px}.brand{display:flex;gap:11px;align-items:center;margin:0 10px 34px;font-size:14px;line-height:1.15}.brand-logo{background:linear-gradient(135deg,#ff3c42 45%,#188bda 45%);color:white;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:23px;flex-shrink:0}.brand small,.user small{display:block;font-size:10px;letter-spacing:1px;margin-top:6px;opacity:.8}.sidebar nav{display:grid;gap:4px}.nav-item{width:100%;text-align:left;border:0;background:none;color:#dce8f7;padding:13px 15px;border-radius:7px;font-size:13px}.nav-item.active,.nav-item:hover{background:#22549a;color:#fff}.nav-item span{display:inline-block;width:27px}.side-bottom{margin-top:auto;padding:18px 12px;font-size:12px;color:#a6b9cf;line-height:1.8}main{flex:1;min-width:0}.topbar{height:76px;background:white;border-bottom:1px solid #e6edf4;display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:20px}.search{border:1px solid #e0e8f2;border-radius:7px;padding:9px 14px;color:#8b9bad;min-width:260px}.search input{border:0;outline:0;width:85%;font-size:13px}.user{display:flex;gap:12px;align-items:center;font-size:12px}.user small{letter-spacing:0}.avatar{font-size:22px}.notification{color:#f43c48}.content{max-width:1550px;margin:auto;padding:28px 30px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.heading h1{font-size:27px;letter-spacing:-.6px;margin:0 0 5px}.heading p{color:#7b8ba0;font-size:13px;margin:0}.primary,.login-card button{border:0;background:#1265eb;color:white;border-radius:7px;padding:11px 17px;font-size:13px;font-weight:600}.outline{border:1px solid #d7e2f0;background:white;border-radius:6px;padding:9px 13px;color:#315070;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;margin-bottom:22px}.card,.panel{background:white;border:1px solid #e6edf6;border-radius:11px;box-shadow:0 3px 15px #233d5c08}.card{padding:22px;min-height:125px}.card .metric{font-size:30px;font-weight:800;margin:13px 0 4px}.card .label{font-size:12px;color:#5c7087}.card .hint{font-size:11px;color:#8da0b6}.card .symbol{font-size:22px}.card.red{border-color:#ffd7d7}.card.orange{border-color:#ffebd4}.card.green{border-color:#d7f1e4}.card.blue{border-color:#dbe7ff}.panels{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}.panel{padding:19px;min-width:0;margin-bottom:18px}.panel h3{font-size:15px;margin:0 0 18px}.map{min-height:335px;background:linear-gradient(40deg,#d4ebd9 10%,#e7f3e7 10% 20%,#e1ebf1 20% 32%,#d7e6e9 32% 45%,#e9f0e3 45%);position:relative;overflow:hidden;border-radius:8px;border:1px solid #dce8e5}.map:before,.map:after{content:'';position:absolute;width:150%;height:16px;background:#fff;transform:rotate(-32deg);left:-20%;top:40%;box-shadow:0 75px 0 #fff,0 -110px 0 #fff}.map:after{transform:rotate(35deg);top:60%;height:10px}.map-label{position:absolute;top:48%;left:43%;font-size:22px;font-weight:700;color:#4c7582;z-index:2}.pin{position:absolute;z-index:3;font-size:27px;filter:drop-shadow(0 2px 3px #0003)}.map-note{position:absolute;bottom:12px;left:12px;background:white;padding:9px 12px;border-radius:7px;z-index:3;font-size:11px}.table-wrap{overflow-x:auto}.data-table{width:100%;border-collapse:collapse;text-align:left;font-size:12px;white-space:nowrap}.data-table th{background:#f7f9fc;color:#60748a;font-weight:600}.data-table th,.data-table td{padding:13px 11px;border-bottom:1px solid #edf1f7}.data-table td{max-width:230px;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-block;padding:5px 9px;border-radius:5px;font-size:11px;font-weight:600;background:#edf3fc;color:#3c618b}.pill.pending,.pill.active,.pill.responding,.pill.in_progress{background:#fff0c8;color:#9c6500}.pill.verified,.pill.resolved,.pill.open,.pill.published{background:#d9f6e4;color:#147a45}.pill.rejected,.pill.critical,.pill.closed{background:#ffe0e1;color:#bd2630}.action{background:#eaf2ff;color:#0d60df;border:0;border-radius:5px;padding:6px 9px;margin:2px;font-size:11px}.action.danger{background:#ffebeb;color:#c52d36}.action.good{background:#e0f8e9;color:#0e8549}.muted{color:#8293a8;font-size:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.pagination{display:flex;justify-content:flex-end;gap:10px;margin-top:17px}.empty{padding:50px;text-align:center;color:#7a8da2}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102a47,#175da4)}.login-card{width:min(430px,92vw);background:white;border-radius:17px;padding:38px;box-shadow:0 20px 60px #0003}.login-card .brand-logo{margin:auto}.login-card h1{text-align:center;margin:16px 0 4px}.login-card p{text-align:center;color:#7d8da2;font-size:13px;margin-bottom:27px}.login-card label{display:block;margin:15px 0;font-size:13px;font-weight:600}.login-card input{width:100%;margin-top:8px;padding:13px;border:1px solid #d7e2ef;border-radius:7px}.login-card button{width:100%;margin:12px 0}.login-card small{display:block;text-align:center;color:#9aabba}.error{color:#c52537;font-size:12px}dialog{border:0;border-radius:13px;box-shadow:0 20px 80px #0003;width:min(530px,95vw);max-height:85vh;overflow:auto;padding:24px}dialog::backdrop{background:#0b223a88}.dialog-head,.dialog-actions{display:flex;justify-content:space-between;align-items:center;gap:12px}.dialog-head h2{margin:0 0 12px}.dialog-actions{justify-content:flex-end;margin-top:20px}#editorFields label{display:block;font-size:12px;font-weight:600;margin:12px 0}#editorFields input,#editorFields textarea,#editorFields select{display:block;width:100%;padding:10px;margin-top:6px;border:1px solid #d6e1ec;border-radius:6px}#toast{position:fixed;bottom:24px;right:24px;background:#122f4f;color:white;padding:12px 20px;border-radius:7px;display:none;z-index:10}.mobile-menu{display:none}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}}@media(max-width:720px){.sidebar{position:fixed;z-index:5;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.mobile-menu{display:block;border:0;background:none;font-size:20px}.topbar{padding:0 14px}.search{min-width:0;width:42%}.user .notification,.user .avatar,.user small{display:none}.content{padding:18px}.cards{gap:10px}.card{padding:14px}.heading h1{font-size:22px}}
</style>
</head>
<body>
<div id="login" class="login">
  <form id="loginForm" class="login-card">
    <div class="brand-logo">✚</div>
    <h1>ResQLink AI</h1>
    <p>CDRRMO / LGU Administration Portal</p>
    <label>Email<input id="email" type="email" autocomplete="username" value="admin@cdrrmo.bacoor.gov.ph" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" value="$2y$10$adminhash123" required></label>
    <button type="submit">Sign in securely</button>
    <div id="loginError" class="error"></div>
    <small>Demo login uses the DB dummy data</small>
  </form>
</div>
<div id="app" class="layout hidden">
  <aside class="sidebar">
    <div class="brand"><div class="brand-logo">✚</div><div><b>CommunityLink<br>ResQLink AI</b><small>ADMIN PANEL</small></div></div>
    <nav id="nav"></nav>
    <div class="side-bottom">Cavite Emergency Operations<br><small>Prototype admin portal</small></div>
  </aside>
  <main>
    <header class="topbar">
      <button id="menuBtn" class="mobile-menu">☰</button>
      <div class="search">⌕ <input id="search" placeholder="Search current module..."></div>
      <div class="user"><span class="notification">●</span><span class="avatar">👤</span><span><b id="adminName">Administrator</b><small id="adminRole">CDRRMO</small></span><button id="logout" class="outline">Logout</button></div>
    </header>
    <div class="content">
      <div class="heading"><div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle">Real-time emergency operations overview</p></div><button id="addBtn" class="primary hidden">+ Add New</button></div>
      <div id="mainContent"></div>
    </div>
  </main>
</div>
<dialog id="editor"><form id="editorForm"><div class="dialog-head"><h2 id="editorTitle">Add record</h2><button type="button" id="closeEditor" class="outline">✕</button></div><div id="editorFields"></div><div class="dialog-actions"><button type="button" id="cancelEditor" class="outline">Cancel</button><button type="submit" class="primary">Save</button></div></form></dialog>
<div id="toast" role="status"></div>

<script>
// ===== REAL API CONNECTION (Connects to api.php) =====
async function api(url, opt = {}) {
    // Redirects the '/api/...' calls to your real PHP file
    let realUrl = 'api.php';
    if (url.includes('/dashboard')) realUrl = 'api.php?module=dashboard';
    else if (url.includes('/reports')) realUrl = 'api.php?module=reports';
    else if (url.includes('/sos')) realUrl = 'api.php?module=sos';
    else if (url.includes('/centers')) realUrl = 'api.php?module=centers';
    else if (url.includes('/announcements')) realUrl = 'api.php?module=announcements';
    else if (url.includes('/services')) realUrl = 'api.php?module=services';
    else if (url.includes('/faqs')) realUrl = 'api.php?module=faqs';
    else if (url.includes('/users')) realUrl = 'api.php?module=users';
    else if (url.includes('/analytics')) realUrl = 'api.php?module=analytics';
    else if (url.includes('/auth/login')) realUrl = 'api.php?module=login';

    const options = {
        method: opt.method || 'GET',
        headers: { 'Content-Type': 'application/json' },
        body: opt.body || null
    };

    const response = await fetch(realUrl, options);
    const data = await response.json();
    
    if (!response.ok) throw new Error(data.error || 'Server error');
    return data;
}

// ===== APP =====
const modules = [
  ['dashboard', '⌂', 'Dashboard', 'Real-time overview of disaster reports, SOS alerts, and community status'],
  ['reports', '▤', 'Disaster Reports', 'Review, verify, and manage community-submitted disaster reports'],
  ['centers', '⌂', 'Evacuation & Routes', 'Manage evacuation center availability and occupancy'],
  ['sos', '⚠', 'SOS Alerts', 'Monitor and respond to emergency SOS requests'],
  ['announcements', '◀', 'Announcements', 'Create and manage public announcements'],
  ['services', '▣', 'Public Service Info', 'Maintain accurate LGU information for citizens'],
  ['faqs', '☏', 'Chatbot Management', 'Manage the chatbot knowledge base and FAQs'],
  ['users', '👤', 'Users', 'Manage LGU personnel and system users'],
  ['analytics', '📊', 'Analytics', 'View system emergency metrics and data trends'],
  ['settings', '⚙', 'Settings', 'Configure system parameters and preferences']
];
const fields = { centers: ['name','address','latitude','longitude','capacity','occupancy','status'], announcements: ['title','body','category','status'], services: ['title','category','content','status'], faqs: ['question','answer','category','status'], users: ['name','email','role','status'] };
const columns = {
  reports: ['id', 'incident_type', 'location_label', 'severity', 'status', 'created_at'],
  sos: ['id', 'status', 'created_at'],
  centers: ['id', 'name', 'address', 'capacity', 'occupancy', 'status'],
  announcements: ['id', 'title', 'category', 'status', 'created_at'],
  services: ['id', 'title', 'category', 'status', 'updated_at'],
  faqs: ['id', 'question', 'category', 'status', 'updated_at'],
  users: ['id', 'email', 'role', 'status']
};
let current = 'dashboard', page = 1, editing = null, rows = [];
const $ = s => document.querySelector(s), esc = x => String(x ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty = s => String(s).replaceAll('_', ' ').replace(/\b\w/g, c => c.toUpperCase());
function toast(s) { $('#toast').textContent = s; $('#toast').style.display = 'block'; setTimeout(() => $('#toast').style.display = 'none', 3000); }
function showLogin() { $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); }
function showApp(user) {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#adminName').textContent = user.name; $('#adminRole').textContent = pretty(user.role);
  $('#nav').innerHTML = modules.map(([id, ico, name]) => `<button class="nav-item" data-page="${id}"><span>${ico}</span>${name}</button>`).join('');
  $('#nav').onclick = e => { const btn = e.target.closest('[data-page]'); if (btn) navigate(btn.dataset.page); };
  navigate('dashboard');
}
function navigate(id) {
  current = id; page = 1; $('#search').value = '';
  const m = modules.find(x => x[0] === id);
  $('#pageTitle').textContent = m[2]; $('#pageSubtitle').textContent = m[3];
  document.querySelectorAll('.nav-item').forEach(x => x.classList.toggle('active', x.dataset.page === id));
  $('#addBtn').classList.toggle('hidden', !fields[id]);
  $('#addBtn').textContent = '+ Add ' + ({ centers:'Evacuation Center', announcements:'Announcement', services:'Information', faqs:'FAQ', users:'User' }[id] || 'New');
  $('.sidebar').classList.remove('open');
  load();
}
const pill = v => `<span class="pill ${esc(v)}">${esc(pretty(String(v ?? '')))}</span>`;
function table(items, keys, actions = true) {
  if (!items || !items.length) return '<div class="empty">No records found.</div>';
  return `<div class="table-wrap"><table class="data-table"><thead><tr>${keys.map(k => `<th>${pretty(k)}</th>`).join('')}${actions ? '<th>Actions</th>' : ''}</tr></thead><tbody>${items.map(r => `<tr>${keys.map(k => `<td title="${esc(r[k])}">${k === 'status' || k === 'severity' ? pill(r[k]) : esc(r[k])}</td>`).join('')}${actions ? `<td>${buttons(r)}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;
}
function buttons(r) {
  if (current === 'reports') return r.status === 'pending'
    ? `<button class="action good" data-action="verified" data-id="${r.id}">Verify</button><button class="action danger" data-action="rejected" data-id="${r.id}">Reject</button>`
    : `<button class="action" data-action="in_progress" data-id="${r.id}">In progress</button><button class="action good" data-action="resolved" data-id="${r.id}">Resolve</button>`;
  if (current === 'sos') return `<button class="action" data-action="responding" data-id="${r.id}">Responding</button><button class="action good" data-action="resolved" data-id="${r.id}">Resolve</button>`;
  return `<button class="action" data-action="edit" data-id="${r.id}">Edit</button><button class="action danger" data-action="delete" data-id="${r.id}">Delete</button>`;
}
function map() {
  return `<div class="map"><div class="map-label">Bacoor / Imus</div><span class="pin" style="top:25%;left:32%">📍</span><span class="pin" style="top:54%;left:65%">📍</span><span class="pin" style="top:70%;left:25%">🏠</span><span class="pin" style="top:30%;left:77%">🏠</span><div class="map-note">Illustrative map only • Integrate Leaflet / OpenStreetMap for live geospatial data</div></div>`;
}
async function load() {
  try {
    if (current === 'dashboard') {
      const d = await api('/api/dashboard');
      const s = d.stats;
      $('#mainContent').innerHTML = `<div class="cards">${[
        ['red','⚠',s.pendingReports,'Pending Reports','Awaiting verification'],
        ['orange','🚨',s.activeSOS,'Active SOS Alerts','Emergency requests'],
        ['green','✓',s.verifiedReports,'Verified Reports','Confirmed incidents'],
        ['blue','⌂',s.openCenters,'Open Centers','Evacuation shelters']
      ].map(x => `<div class="card ${x[0]}"><div class="symbol">${x[1]}</div><div class="metric">${x[2]}</div><div class="label">${x[3]}</div><div class="hint">${x[4]}</div></div>`).join('')}</div><div class="panels"><section class="panel"><h3>Incident Map Preview</h3>${map()}</section><section class="panel"><h3>Recent Disaster Reports</h3>${table(d.reports,['id','incident_type','status'],false)}<br><h3>Active SOS</h3>${table(d.sos,['id','status'],false)}</section></div>`;
      return;
    }
    if (current === 'analytics') {
      $('#mainContent').innerHTML = `<section class="panel"><h3>System Analytics & Statistics</h3><p>Analytics data will load from database.</p></section>`;
      return;
    }
    if (current === 'settings') {
      $('#mainContent').innerHTML = `<section class="panel"><h3>System Settings</h3><form id="settingsForm" style="max-width:500px;display:flex;flex-direction:column;gap:15px;margin-top:15px;"><label>System Name <input type="text" name="system_name" value="ResQLink AI" style="width:100%"></label><label>Emergency Hotline <input type="text" name="hotline" value="911 / (046) 471-1111" style="width:100%"></label><button type="submit" class="primary">Save Settings</button></form></section>`;
      $('#settingsForm').onsubmit = e => { e.preventDefault(); toast('Settings saved successfully!'); };
      return;
    }
    const q = new URLSearchParams({ page, search: $('#search').value });
    const d = await api(`/api/${current}?${q}`);
    rows = d.rows || [];
    $('#mainContent').innerHTML = `<section class="panel"><div class="toolbar"><b>${d.total || 0} records</b><span class="muted">Page ${d.page || 1} • 20 records per page</span></div>${table(rows, columns[current])}<div class="pagination"><button class="outline" id="prev" ${page === 1 ? 'disabled' : ''}>← Previous</button><button class="outline" id="next" ${!d.total || page * 20 >= d.total ? 'disabled' : ''}>Next →</button></div></section>`;
    $('#prev').onclick = () => { page--; load(); };
    $('#next').onclick = () => { page++; load(); };
  } catch (e) {
    $('#mainContent').innerHTML = `<div class="panel error">${esc(e.message)}</div>`;
  }
}
$('#mainContent').onclick = async e => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  const id = Number(b.dataset.id), act = b.dataset.action;
  try {
    if (act === 'edit') { openEditor(rows.find(x => x.id === id)); return; }
    if (act === 'delete') { if (!confirm('Permanently delete this record?')) return; await api(`/api/${current}/${id}`, { method: 'DELETE' }); }
    else { if (!confirm(`Change record #${id} to ${pretty(act)}?`)) return; await api(`/api/${current}/${id}`, { method: 'PATCH', body: JSON.stringify({ status: act }) }); }
    toast('Record updated'); load();
  } catch (e) { toast(e.message); }
};
function openEditor(record = null) {
  editing = record;
  $('#editorTitle').textContent = (record ? 'Edit ' : 'Add ') + modules.find(m => m[0] === current)[2];
  $('#editorFields').innerHTML = fields[current].map(k => {
    let input = ['body','content','answer','question'].includes(k)
      ? `<textarea name="${k}" rows="4">${esc(record?.[k] ?? '')}</textarea>`
      : `<input name="${k}" value="${esc(record?.[k] ?? '')}" ${['latitude','longitude','capacity','occupancy'].includes(k) ? 'type="number" step="any"' : 'type="text"'}>`;
    if (k === 'status') {
      const vals = { centers:['open','closed'], announcements:['draft','published'], services:['active','inactive'], faqs:['active','inactive'], users:['active','inactive'] }[current];
      input = `<select name="status">${vals.map(v => `<option value="${v}" ${record?.status === v ? 'selected' : ''}>${pretty(v)}</option>`).join('')}</select>`;
    }
    return `<label>${pretty(k)}${input}</label>`;
  }).join('');
  $('#editor').showModal();
}
$('#editorForm').onsubmit = async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  for (const k of ['latitude','longitude','capacity','occupancy']) if (k in data) data[k] = data[k] === '' ? null : Number(data[k]);
  try {
    await api(`/api/${current}${editing ? '/' + editing.id : ''}`, { method: editing ? 'PATCH' : 'POST', body: JSON.stringify(data) });
    $('#editor').close(); toast('Saved successfully'); load();
  } catch (e) { toast(e.message); }
};
$('#closeEditor').onclick = $('#cancelEditor').onclick = () => $('#editor').close();
$('#addBtn').onclick = () => openEditor();
$('#menuBtn').onclick = () => $('.sidebar').classList.toggle('open');
let timer;
$('#search').oninput = () => { clearTimeout(timer); timer = setTimeout(() => { page = 1; load(); }, 350); };
$('#loginForm').onsubmit = async e => {
  e.preventDefault(); $('#loginError').textContent = '';
  try { const user = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email: $('#email').value, password: $('#password').value }) }); showApp(user); }
  catch (err) { $('#loginError').textContent = err.message; }
};
$('#logout').onclick = async () => { showLogin(); };
</script>
</body>
</html>
